name: Deploy

on:
  # Required PR checks must run even for documentation-only changes.
  pull_request:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "e2e_tests/**"
      - ".dockerignore"
      - "tests/**"
      - "make.sh"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  # PRs cannot displace a queued production deployment or an unrelated PR.
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      deploy: ${{ steps.result.outputs.deploy }}
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Find the latest stable CLI release
        id: update
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Deploy-your-Startup/cli/releases/latest > "$RUNNER_TEMP/cli-release.json"
          python3 scripts/update_cli_release.py --release "$RUNNER_TEMP/cli-release.json" >> "$GITHUB_OUTPUT"
      - name: Test and commit a new installer pin
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./make.sh test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/install.sh
          git commit -m "Update installer to latest stable CLI release"
          git push origin HEAD:main
          # Token-authenticated pushes do not trigger another push workflow.
          # Dispatch a fresh run so the reusable deploy checks out the new SHA.
          gh workflow run deploy.yml --ref main
      - name: Select deployment commit
        id: result
        env:
          UPDATED: ${{ steps.update.outputs.changed }}
        run: |
          if [ "$UPDATED" != true ] && { [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check installer and landing page
        run: ./make.sh test

  installer-factory:
    needs: release
    if: ${{ always() && (github.event_name == 'pull_request' || needs.release.outputs.deploy == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
      - name: Install Factory workspace prerequisites
        run: brew install mise yq
      - name: Test real installer and published CLI through Factory setup
        run: python3 scripts/check_installer_factory_e2e.py

  browser:
    needs: release
    if: ${{ always() && (github.event_name == 'pull_request' || needs.release.outputs.deploy == 'true') }}
    uses: Deploy-your-Startup/deploy-your-startup/.github/workflows/container-e2e.yml@70ef841b99dbc03e5e762a83da93ae5476ab6488
    with:
      shards: 1

  pull-request-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: ./make.sh test

  deploy:
    needs: [release, test, browser, installer-factory]
    uses: Deploy-your-Startup/deploy-your-startup/.github/workflows/deploy-pages.yml@main
    with:
      project_name: deploy-your-startup-website
      # Public repositories deploy through the main-only production environment;
      # private ones use repository secrets (environments there need a paid plan).
      environment: ${{ github.event.repository.visibility == 'public' && 'production' || '' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
